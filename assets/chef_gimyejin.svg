<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- 배경 후광 원 -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" stroke-dasharray="16,8"/>
  <circle cx="250" cy="250" r="190" fill="#fff" opacity="0.6"/>

  <!-- 캐릭터 몸통 & 주황색 앞치마 -->
  <g filter="url(#shadow)">
    <!-- 어깨 & 상의 -->
    <path d="M 150,380 C 150,310 350,310 350,380 L 370,480 L 130,480 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <!-- 귀여운 주황색 앞치마 -->
    <path d="M 180,330 L 320,330 L 340,480 L 160,480 Z" fill="url(#apronGrad)" rx="12"/>
    <!-- 앞치마 끈 & 주머니 -->
    <path d="M 210,330 L 210,400 L 290,400 L 290,330" fill="none" stroke="#fef08a" stroke-width="4"/>
    <rect x="210" y="400" width="80" height="60" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <!-- 주머니 속 뒤집개 & 국자 -->
    <text x="235" y="440" font-size="30">🍳</text>
  </g>

  <!-- 목 -->
  <rect x="230" y="270" width="40" height="50" rx="20" fill="#fed7aa"/>

  <!-- 머리 & 예쁜 단발머리 -->
  <g filter="url(#shadow)">
    <!-- 뒤 갈색 머리 -->
    <circle cx="250" cy="200" r="95" fill="#451a03"/>
    <!-- 얼굴 피부 -->
    <circle cx="250" cy="210" r="75" fill="#ffedd5"/>
    
    <!-- 앞머리 -->
    <path d="M 175,190 C 190,145 230,150 250,165 C 270,150 310,145 325,190 C 300,165 270,160 250,170 C 230,160 200,165 175,190 Z" fill="#451a03"/>

    <!-- 발랄한 볼터치 -->
    <circle cx="205" cy="225" r="14" fill="#fda4af" opacity="0.75"/>
    <circle cx="295" cy="225" r="14" fill="#fda4af" opacity="0.75"/>

    <!-- 반짝이는 귀여운 눈 -->
    <ellipse cx="215" cy="205" rx="9" ry="12" fill="#1e293b"/>
    <ellipse cx="285" cy="205" rx="9" ry="12" fill="#1e293b"/>
    <!-- 눈동자 반짝임 하이라이트 -->
    <circle cx="212" cy="200" r="4" fill="#ffffff"/>
    <circle cx="282" cy="200" r="4" fill="#ffffff"/>

    <!-- 방긋 웃는 입 -->
    <path d="M 235,230 Q 250,245 265,230" fill="none" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- 웅장한 흰색 셰프 모자 (Chef Toque) -->
  <g filter="url(#shadow)">
    <path d="M 190,145 Q 180,70 250,60 Q 320,70 310,145 Z" fill="#ffffff"/>
    <path d="M 180,105 C 160,80 200,50 230,60 C 250,45 280,50 300,70 C 330,80 320,110 310,120 Z" fill="#ffffff" opacity="0.9"/>
    <!-- 모자 띠 & 황금 스티치 -->
    <rect x="190" y="130" width="120" height="20" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <!-- 리본 / 로고 -->
    <circle cx="250" cy="140" r="7" fill="#f97316"/>
  </g>
</svg>